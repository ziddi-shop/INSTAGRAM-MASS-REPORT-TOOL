name: Auto Update

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Timestamp
        run: |
          date -u +"Last auto update: %Y-%m-%d %H:%M:%S UTC" > LAST_UPDATE.txt

      - name: Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LAST_UPDATE.txt
          git diff --cached --quiet || git commit -m "Automatic update"
          git push
